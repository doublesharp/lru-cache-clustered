<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" fill="none" font-family="Arial, Helvetica, sans-serif">
  <title>Shared cache topology</title>
  <desc>The primary process holds one authoritative LRU cache per namespace. Workers send requests over IPC and receive responses. Optional worker-local L1 caches serve hot reads without IPC. Writes reach the primary and invalidate local entries asynchronously by default.</desc>

  <defs>
    <marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Opaque canvas keeps the colors legible in light and dark README themes. -->
  <rect x="1" y="1" width="798" height="518" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="24" y="24" width="752" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">Primary process</text>
  <text x="400" y="94" text-anchor="middle" font-size="18" fill="#334155">One shared LRU cache per namespace</text>

  <rect x="176" y="114" width="136" height="36" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="244" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">users</text>
  <rect x="332" y="114" width="136" height="36" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="400" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">sessions</text>
  <rect x="488" y="114" width="136" height="36" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="556" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">products</text>
  <text x="400" y="182" text-anchor="middle" font-size="17" fill="#334155">Atomic counters · Coordinated fetches</text>

  <!-- Each arrow has its own lane; labels sit outside those lanes. -->
  <path d="M160 326V206" stroke="#2563eb" stroke-width="2" marker-end="url(#request)"/>
  <text x="144" y="272" text-anchor="end" font-size="17" font-weight="700" fill="#1d4ed8">Request</text>
  <path d="M244 206V326" stroke="#64748b" stroke-width="2" marker-end="url(#response)"/>
  <text x="260" y="272" font-size="17" fill="#475569">Response</text>

  <path d="M556 326V206" stroke="#2563eb" stroke-width="2" marker-end="url(#request)"/>
  <text x="540" y="272" text-anchor="end" font-size="17" font-weight="700" fill="#1d4ed8">Request</text>
  <path d="M640 206V326" stroke="#64748b" stroke-width="2" marker-end="url(#response)"/>
  <text x="656" y="272" font-size="17" fill="#475569">Response</text>

  <rect x="24" y="328" width="356" height="136" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="202" y="364" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Worker 1</text>
  <text x="202" y="392" text-anchor="middle" font-size="17" fill="#475569">Async cache API over IPC</text>
  <rect x="48" y="410" width="308" height="36" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="202" y="434" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Optional local L1 cache</text>

  <rect x="420" y="328" width="356" height="136" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="598" y="364" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Worker 2 … N</text>
  <text x="598" y="392" text-anchor="middle" font-size="17" fill="#475569">Async cache API over IPC</text>
  <rect x="444" y="410" width="308" height="36" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="598" y="434" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Optional local L1 cache</text>

  <text x="400" y="498" text-anchor="middle" font-size="16" fill="#475569">Local hits skip IPC. Writes invalidate L1 entries asynchronously.</text>
</svg>
